# Additive self-hosted email/password overlay. Invoke after docker-compose.yml.
# The credential directory must already contain a mode-600 users.json.
services:
  terminal:
    image: ${TERMINAL_PASSWORD_IMAGE:-vexaai/v012-terminal:email-password-local}
    environment:
      VEXA_PASSWORD_AUTH_FILE: /var/lib/vexa-auth/users.json
      VEXA_AUTH_COOKIE_NAME: vexa-password-token
      VEXA_USER_INFO_COOKIE_NAME: vexa-password-user-info
    volumes:
      - ${VEXA_PASSWORD_AUTH_DIR:-./auth}:/var/lib/vexa-auth:ro
